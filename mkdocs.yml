site_name: IT Knowledge Base
site_description: Tổng hợp kiến thức Network, System, Helpdesk
site_url: https://hiencrab.github.io/knowledge-base/
repo_url: https://github.com/hiencrab/knowledge-base
theme:
  name: material
  language: vi
  icon:
    logo: material/book-open-page-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Chuyển sang chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang chế độ sáng
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
extra_css:
  - stylesheets/extra.css
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Trang chủ: index.md
  - Network:
      - network/index.md
      - Mô hình OSI và TCP/IP: network/osi-tcpip.md
      - Chia subnet: network/subnetting.md
      - Xử lý sự cố mạng: network/troubleshooting.md
  - System:
      - system/index.md
      - Lệnh Linux thường dùng: system/linux-commands.md
      - Windows và Active Directory: system/windows-ad.md
      - Sao lưu và khôi phục: system/backup.md
  - Helpdesk:
      - helpdesk/index.md
      - Quy trình xử lý ticket: helpdesk/ticket-process.md
      - Checklist sự cố thường gặp: helpdesk/common-issues.md
  - Mẫu ghi chú: template.md
